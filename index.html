<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>C.D. Ugena EFM 'A'</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24 font-sans select-none">

  <!-- CABECERA FIJA -->
  <header class="sticky top-0 z-30 bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 flex items-center justify-between shadow-sm">
    <div>
      <h1 class="font-black text-sm tracking-wide text-white uppercase">C.D. UGENA EFM 'A'</h1>
      <p class="text-[11px] text-sky-400 font-medium">Preferente Alevín · Grupo 6</p>
    </div>
    <span id="txt-sync" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full border border-slate-600">Conectando...</span>
  </header>

  <!-- PANTALLA DE CARGA / ERROR -->
  <div id="loading" class="flex flex-col items-center justify-center py-28 px-4">
    <div id="loading-spinner" class="w-9 h-9 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-text" class="mt-4 text-xs font-medium text-slate-400 text-center">Sincronizando datos del equipo...</p>
  </div>

  <main id="app" class="hidden p-4 max-w-md mx-auto space-y-4">

    <!-- 1. PESTAÑA: INICIO -->
    <section id="tab-inicio" class="tab-content active space-y-4">
      <div class="bg-gradient-to-br from-sky-600 to-indigo-700 rounded-2xl p-4 shadow-lg text-white">
        <span class="text-[10px] font-bold uppercase tracking-wider bg-black/25 px-2 py-0.5 rounded-full inline-block mb-2">Próximo Encuentro</span>
        <div id="next-match-content"></div>
      </div>

      <!-- Tarjeta Posición + Puntos -->
      <div id="quick-standing" class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex justify-between items-center"></div>

      <!-- Balance de Temporada -->
      <div>
        <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Balance de Temporada</h2>
        <div class="grid grid-cols-4 gap-2 text-center mb-2">
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700">
            <span class="text-[10px] text-slate-400 block">Jugados</span>
            <span id="kpi-pj" class="text-base font-black text-white">-</span>
          </div>
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700">
            <span class="text-[10px] text-emerald-400 block">Victorias</span>
            <span id="kpi-v" class="text-base font-black text-emerald-400">-</span>
          </div>
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700">
            <span class="text-[10px] text-amber-400 block">Empates</span>
            <span id="kpi-e" class="text-base font-black text-amber-400">-</span>
          </div>
          <div class="bg-slate-800 rounded-xl p-2.5 border border-slate-700">
            <span class="text-[10px] text-rose-400 block">Derrotas</span>
            <span id="kpi-d" class="text-base font-black text-rose-400">-</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-slate-800 rounded-xl p-3 border border-slate-700">
            <span class="text-[11px] text-sky-400 block">Goles a Favor</span>
            <span id="kpi-gf" class="text-lg font-black text-sky-400">-</span>
          </div>
          <div class="bg-slate-800 rounded-xl p-3 border border-slate-700">
            <span class="text-[11px] text-slate-400 block">Goles en Contra</span>
            <span id="kpi-gc" class="text-lg font-black text-slate-200">-</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. PESTAÑA: CLASIFICACIÓN -->
    <section id="tab-clasificacion" class="tab-content space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-sm">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-700/50 text-[10px] text-slate-400 uppercase font-semibold border-b border-slate-700">
              <th class="py-2.5 pl-3 pr-1 w-6 text-center">Pos</th>
              <th class="py-2.5 px-2">Equipo</th>
              <th class="py-2.5 px-1 text-center font-bold text-white">Pts</th>
              <th class="py-2.5 px-1 text-center">PJ</th>
              <th class="py-2.5 px-1 text-center">PG</th>
              <th class="py-2.5 px-1 text-center">DIF</th>
            </tr>
          </thead>
          <tbody id="lista-clasificacion" class="divide-y divide-slate-700/60"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. PESTAÑA: CALENDARIO -->
    <section id="tab-calendario" class="tab-content space-y-3">
      <div class="flex gap-2">
        <button onclick="filtrarPartidos('todos', this)" class="btn-filtro flex-1 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white">Todos</button>
        <button onclick="filtrarPartidos('Pendiente', this)" class="btn-filtro flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300">Pendientes</button>
        <button onclick="filtrarPartidos('Finalizado', this)" class="btn-filtro flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300">Jugados</button>
      </div>
      <div id="lista-partidos" class="space-y-3"></div>
    </section>

    <!-- 4. PESTAÑA: GOLEADORES -->
    <section id="tab-goleadores" class="tab-content space-y-3">
      <div class="flex gap-2">
        <button onclick="toggleGoleadores(true)" id="btn-gol-ugena" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white">Solo Ugena</button>
        <button onclick="toggleGoleadores(false)" id="btn-gol-todos" class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300">Todo el Grupo</button>
      </div>
      <div id="lista-goleadores" class="bg-slate-800 rounded-xl divide-y divide-slate-700 border border-slate-700"></div>
    </section>

    <!-- 5. PESTAÑA: GRÁFICOS -->
    <section id="tab-graficos" class="tab-content space-y-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">Balance de Resultados</h3>
        <div class="relative h-48 flex items-center justify-center">
          <canvas id="chartResultados"></canvas>
        </div>
      </div>

      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">Goles por Jugador (Ugena)</h3>
        <div class="relative h-56">
          <canvas id="chartGoleadores"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-800/95 backdrop-blur border-t border-slate-700 py-2 px-3 flex justify-around z-40">
    <button onclick="switchTab('inicio', this)" class="nav-btn active flex flex-col items-center text-sky-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[9px] mt-1 font-medium">Inicio</span>
    </button>
    <button onclick="switchTab('clasificacion', this)" class="nav-btn flex flex-col items-center text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span class="text-[9px] mt-1 font-medium">Clasif.</span>
    </button>
    <button onclick="switchTab('calendario', this)" class="nav-btn flex flex-col items-center text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-[9px] mt-1 font-medium">Partidos</span>
    </button>
    <button onclick="switchTab('goleadores', this)" class="nav-btn flex flex-col items-center text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span class="text-[9px] mt-1 font-medium">Goles</span>
    </button>
    <button onclick="switchTab('graficos', this)" class="nav-btn flex flex-col items-center text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
      <span class="text-[9px] mt-1 font-medium">Gráficos</span>
    </button>
  </nav>

  <script>
    const ID_HOJA = "13hXI7RhIPz9SvvFghuCedKNm6aC-HxTdXkasN5afS8g";

    let appData = { partidos: [], goleadores: [], clasificacion: [], direcciones: {} };
    let chartResultadosInstance = null;
    let chartGoleadoresInstance = null;
    let soloGoleadoresUgena = true;

    // Obtener enlace a Google Maps consultando la tabla de Direcciones
    function obtenerEnlaceMaps(nombreCampo) {
      if (!nombreCampo || nombreCampo === "Por confirmar") return null;

      const clave = nombreCampo.trim().toUpperCase();
      const destino = appData.direcciones[clave];

      // Si existe en la hoja Direcciones
      if (destino) {
        if (destino.startsWith("http://") || destino.startsWith("https://")) {
          return destino;
        }
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destino)}`;
      }

      // Si no está registrado en Direcciones, busca con el nombre federativo
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nombreCampo + ' futbol')}`;
    }

    async function descargarHojaGViz(nombreHoja) {
      const url = `https://docs.google.com/spreadsheets/d/${ID_HOJA}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(nombreHoja)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Acceso denegado o error de red al consultar " + nombreHoja);
      const txt = await res.text();
      const start = txt.indexOf('{');
      const end = txt.lastIndexOf('}');
      if (start === -1 || end === -1) throw new Error("No se pudo leer la hoja " + nombreHoja);
      const data = JSON.parse(txt.substring(start, end + 1));
      if (data.status === 'error') throw new Error("Error en pestaña " + nombreHoja + ": " + data.errors[0].message);
      return data.table.rows.map(r => r.c ? r.c.map(cell => cell ? (cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '')) : '') : []);
    }

    async function cargarDatos() {
      try {
        // Carga simultánea de las 5 pestañas
        const [filasPartidos, filasGoleadores, filasClasif, filasControl, filasDirecciones] = await Promise.all([
          descargarHojaGViz("Partidos"),
          descargarHojaGViz("Goleadores"),
          descargarHojaGViz("Clasificacion"),
          descargarHojaGViz("Control"),
          descargarHojaGViz("Direcciones").catch(() => []) // Evita fallo si la hoja aún está vacía
        ]);

        const partidos = filasPartidos.map(r => ({
          jornada: r[0], fecha: r[1], hora: r[2], local: r[3], visitante: r[4],
          golesLocal: r[5], golesVisitante: r[6], campo: r[7], estado: r[8], urlActa: r[9]
        }));

        const goleadores = filasGoleadores.map(r => ({
          posicion: r[0], jugador: r[1], equipo: r[2], goles: Number(r[3]) || 0, esUgena: r[4] === "Sí"
        }));

        const clasificacion = filasClasif.map((r, i) => ({
          pos: Number(r[0]) || (i + 1), equipo: r[1], ptos: Number(r[2]) || 0, pj: Number(r[3]) || 0,
          pg: Number(r[4]) || 0, pe: Number(r[5]) || 0, pp: Number(r[6]) || 0, gf: Number(r[7]) || 0,
          gc: Number(r[8]) || 0, dif: Number(r[9]) || 0, esUgena: r[10] === "Sí"
        }));

        // Mapeo clave (Columna A) -> Búsqueda Maps (Columna B)
        const direcciones = {};
        filasDirecciones.forEach(r => {
          const clave = (r[0] || "").trim().toUpperCase();
          const valor = (r[1] || "").trim();
          if (clave && valor) {
            direcciones[clave] = valor;
          }
        });

        const ultimaAct = filasControl.length > 0 ? filasControl[filasControl.length - 1][0] : "Hoy";

        renderApp({ partidos, goleadores, clasificacion, direcciones, ultimaAct });
      } catch (err) {
        mostrarError(err.message);
      }
    }

    function mostrarError(msg) {
      const load = document.getElementById('loading');
      if (load) {
        load.innerHTML = `
          <div class="bg-rose-950/90 border border-rose-500/60 p-4 rounded-xl text-rose-200 text-xs text-center max-w-xs shadow-xl">
            <p class="font-bold text-sm mb-1 text-rose-400">Error de Sincronización</p>
            <p class="leading-relaxed mb-3">${msg}</p>
            <p class="text-[10px] text-rose-300/80">Comprueba que la hoja esté compartida como «Cualquier persona con el enlace (Lector)».</p>
          </div>
        `;
      }
    }

    function renderApp(data) {
      appData = data;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('txt-sync').innerText = "Act: " + (data.ultimaAct || "Hoy");

      renderNextMatch();
      renderQuickStanding();
      renderKPIs();
      renderClasificacion();
      renderPartidos('todos');
      renderGoleadores();
      renderCharts();
    }

    function renderNextMatch() {
      const container = document.getElementById('next-match-content');
      const proximos = (appData.partidos || []).filter(p => p.estado === 'Pendiente');
      
      if (proximos.length === 0) {
        container.innerHTML = "<p class='text-sm text-slate-200'>Temporada finalizada.</p>";
        return;
      }

      const p = proximos[0];
      const esLocal = (p.local || "").toUpperCase().includes('UGENA');
      const rival = esLocal ? p.visitante : p.local;
      const urlMaps = obtenerEnlaceMaps(p.campo);

      container.innerHTML = `
        <div class="flex justify-between items-baseline mb-1">
          <span class="text-xs text-sky-200 font-semibold">Jornada ${p.jornada}</span>
          <span class="text-xs bg-sky-950/70 border border-sky-400/30 px-2 py-0.5 rounded text-white font-medium">${p.fecha} ${p.hora ? '· ' + p.hora : ''}</span>
        </div>
        <div class="text-base font-extrabold text-white">${esLocal ? 'En Casa vs ' + rival : 'Fuera vs ' + rival}</div>
        <div class="text-[11px] text-sky-100 flex items-center gap-1 mt-2.5">
          <span>📍</span>
          ${urlMaps ? `
            <a href="${urlMaps}" target="_blank" rel="noopener noreferrer" class="underline hover:text-white flex items-center gap-1 font-medium bg-black/20 px-2 py-0.5 rounded transition">
              <span class="truncate max-w-[240px]">${p.campo}</span>
              <span class="text-[9px] text-sky-300 font-bold uppercase tracking-wider">Abrir Maps ↗</span>
            </a>
          ` : `<span class="truncate">${p.campo}</span>`}
        </div>
      `;
    }

    function renderQuickStanding() {
      const posUgena = (appData.clasificacion || []).find(c => c.esUgena);
      const container = document.getElementById('quick-standing');
      if (posUgena) {
        container.innerHTML = `
          <div>
            <span class="text-[10px] text-slate-400 uppercase font-semibold block">Posición en Liga</span>
            <span class="text-sm font-bold text-white">${posUgena.pos}º Clasificado</span>
          </div>
          <span class="text-xs bg-sky-500/20 text-sky-400 font-black px-2.5 py-1 rounded-lg border border-sky-500/30">
            ${posUgena.ptos} PTS
          </span>
        `;
      }
    }

    function renderKPIs() {
      const finalizados = (appData.partidos || []).filter(p => p.estado === 'Finalizado');
      let v = 0, e = 0, d = 0, gf = 0, gc = 0;

      finalizados.forEach(p => {
        const esLocal = (p.local || "").toUpperCase().includes('UGENA');
        const golesUgena = Number(esLocal ? p.golesLocal : p.golesVisitante) || 0;
        const golesRival = Number(esLocal ? p.golesVisitante : p.golesLocal) || 0;

        gf += golesUgena;
        gc += golesRival;

        if (golesUgena > golesRival) v++;
        else if (golesUgena === golesRival) e++;
        else d++;
      });

      document.getElementById('kpi-pj').innerText = finalizados.length;
      document.getElementById('kpi-v').innerText = v;
      document.getElementById('kpi-e').innerText = e;
      document.getElementById('kpi-d').innerText = d;
      document.getElementById('kpi-gf').innerText = gf;
      document.getElementById('kpi-gc').innerText = gc;
    }

    function renderClasificacion() {
      const tbody = document.getElementById('lista-clasificacion');
      tbody.innerHTML = "";

      (appData.clasificacion || []).forEach(c => {
        const filaUgena = c.esUgena;
        tbody.innerHTML += `
          <tr class="${filaUgena ? 'bg-sky-500/15 font-bold text-sky-200' : 'text-slate-200'}">
            <td class="py-2.5 pl-3 pr-1 text-center font-bold ${c.pos <= 3 ? 'text-amber-400' : 'text-slate-400'}">${c.pos}</td>
            <td class="py-2.5 px-2 truncate max-w-[150px]">${c.equipo}</td>
            <td class="py-2.5 px-1 text-center font-black ${filaUgena ? 'text-sky-300' : 'text-white'}">${c.ptos}</td>
            <td class="py-2.5 px-1 text-center text-slate-400">${c.pj}</td>
            <td class="py-2.5 px-1 text-center text-slate-400">${c.pg}</td>
            <td class="py-2.5 px-1 text-center ${c.dif > 0 ? 'text-emerald-400' : (c.dif < 0 ? 'text-rose-400' : 'text-slate-400')}">${c.dif > 0 ? '+' + c.dif : c.dif}</td>
          </tr>
        `;
      });
    }

    function renderPartidos(filtro) {
      const container = document.getElementById('lista-partidos');
      container.innerHTML = "";

      const lista = (appData.partidos || []).filter(p => filtro === 'todos' || p.estado === filtro);

      lista.forEach(p => {
        const finalizado = p.estado === 'Finalizado';
        const urlMaps = obtenerEnlaceMaps(p.campo);

        container.innerHTML += `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm">
            <div class="flex justify-between items-center text-[10px] text-slate-400 mb-2">
              <span class="font-bold text-sky-400">Jornada ${p.jornada}</span>
              <span>${p.fecha} ${p.hora ? '· ' + p.hora : ''}</span>
            </div>
            <div class="flex justify-between items-center text-xs font-semibold">
              <span class="truncate flex-1 ${(p.local || '').toUpperCase().includes('UGENA') ? 'text-sky-300 font-bold' : 'text-slate-200'}">${p.local}</span>
              <span class="px-2 py-0.5 mx-2 rounded text-xs ${finalizado ? 'bg-slate-700 text-white font-black' : 'text-slate-500 font-normal'}">${finalizado ? p.golesLocal + ' - ' + p.golesVisitante : 'vs'}</span>
              <span class="truncate flex-1 text-right ${(p.visitante || '').toUpperCase().includes('UGENA') ? 'text-sky-300 font-bold' : 'text-slate-200'}">${p.visitante}</span>
            </div>
            <div class="text-[10px] text-slate-400 mt-2 truncate flex items-center justify-between border-t border-slate-700/50 pt-2">
              <span class="truncate flex items-center gap-1">
                <span>📍</span>
                ${urlMaps ? `<a href="${urlMaps}" target="_blank" rel="noopener noreferrer" class="hover:text-sky-300 underline">${p.campo}</a>` : p.campo}
              </span>
              ${p.urlActa ? `<a href="${p.urlActa}" target="_blank" class="text-sky-400 font-medium underline ml-2">Acta</a>` : ''}
            </div>
          </div>
        `;
      });
    }

    function filtrarPartidos(tipo, btn) {
      document.querySelectorAll('.btn-filtro').forEach(b => {
        b.className = "btn-filtro flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300";
      });
      if (btn) btn.className = "btn-filtro flex-1 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white";
      renderPartidos(tipo);
    }

    function renderGoleadores() {
      const container = document.getElementById('lista-goleadores');
      container.innerHTML = "";

      const lista = (appData.goleadores || []).filter(g => !soloGoleadoresUgena || g.esUgena);

      if (lista.length === 0) {
        container.innerHTML = "<div class='p-4 text-xs text-slate-400 text-center'>No hay anotadores registrados.</div>";
        return;
      }

      lista.forEach((g, idx) => {
        container.innerHTML += `
          <div class="p-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold ${idx < 3 ? 'text-amber-400' : 'text-slate-400'} w-4 text-center">${idx + 1}</span>
              <div>
                <p class="text-xs font-bold text-white">${g.jugador}</p>
                <p class="text-[10px] text-slate-400 truncate max-w-[200px]">${g.equipo}</p>
              </div>
            </div>
            <span class="text-sm font-black text-sky-400 px-2">${g.goles} ⚽</span>
          </div>
        `;
      });
    }

    function toggleGoleadores(soloUgena) {
      soloGoleadoresUgena = soloUgena;
      document.getElementById('btn-gol-ugena').className = soloUgena ? 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white' : 'flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300';
      document.getElementById('btn-gol-todos').className = !soloUgena ? 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white' : 'flex-1 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300';
      renderGoleadores();
    }

    function renderCharts() {
      const finalizados = (appData.partidos || []).filter(p => p.estado === 'Finalizado');
      let v = 0, e = 0, d = 0;
      finalizados.forEach(p => {
        const esLocal = (p.local || "").toUpperCase().includes('UGENA');
        const gU = Number(esLocal ? p.golesLocal : p.golesVisitante) || 0;
        const gR = Number(esLocal ? p.golesVisitante : p.golesLocal) || 0;
        if (gU > gR) v++;
        else if (gU === gR) e++;
        else d++;
      });

      const canvasRes = document.getElementById('chartResultados');
      if (canvasRes) {
        const ctxRes = canvasRes.getContext('2d');
        if (chartResultadosInstance) chartResultadosInstance.destroy();
        chartResultadosInstance = new Chart(ctxRes, {
          type: 'doughnut',
          data: {
            labels: ['Victorias', 'Empates', 'Derrotas'],
            datasets: [{
              data: [v, e, d],
              backgroundColor: ['#10b981', '#f59e0b', '#f43f5e'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } }
            }
          }
        });
      }

      const scorers = (appData.goleadores || []).filter(g => g.esUgena).slice(0, 5);
      const canvasGol = document.getElementById('chartGoleadores');
      if (canvasGol) {
        const ctxGol = canvasGol.getContext('2d');
        if (chartGoleadoresInstance) chartGoleadoresInstance.destroy();
        chartGoleadoresInstance = new Chart(ctxGol, {
          type: 'bar',
          data: {
            labels: scorers.map(g => g.jugador.split(',')[0]),
            datasets: [{
              data: scorers.map(g => g.goles),
              backgroundColor: '#0284c7',
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#94a3b8', stepSize: 1 }, grid: { color: '#334155' } },
              y: { ticks: { color: '#cbd5e1', font: { size: 10 } }, grid: { display: false } }
            }
          }
        });
      }
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-btn').forEach(b => {
        b.className = "nav-btn flex flex-col items-center text-slate-400";
      });
      if (btn) btn.className = "nav-btn active flex flex-col items-center text-sky-400";
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', cargarDatos);
    } else {
      cargarDatos();
    }
  </script>
</body>
</html>
